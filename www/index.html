<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#12443F">
<title>ExploreTangsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="device" id="device">

  <!-- ================= SPLASH ================= -->
  <section class="screen" id="splash" aria-label="Selamat datang di ExploreTangsel">
    <button class="skip" id="skipSplash">Lewati</button>
    <svg class="stage" viewBox="0 0 400 440" aria-hidden="true">
      <defs>
        <linearGradient id="spSepal" x1="0" y1="0" x2="0" y2="-1"><stop offset="0" stop-color="#E9A9CB"/><stop offset="1" stop-color="#FBEAF3"/></linearGradient>
        <linearGradient id="spPetal" x1="0" y1="0" x2="0" y2="-1"><stop offset="0" stop-color="#C55E9C"/><stop offset="1" stop-color="#F3C4DD"/></linearGradient>
        <radialGradient id="spGlow"><stop offset="0" stop-color="#F7DCEA" stop-opacity=".55"/><stop offset="1" stop-color="#F7DCEA" stop-opacity="0"/></radialGradient>
        <linearGradient id="spWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7D6B" stop-opacity=".55"/><stop offset="1" stop-color="#12443F" stop-opacity="0"/></linearGradient>
        <clipPath id="spClip"><rect x="0" y="0" width="400" height="362"/></clipPath>
      </defs>
      <!-- skyline: kota modern -->
      <g clip-path="url(#spClip)" fill="#1E6157">
        <rect class="sky-b" style="animation-delay:.05s" x="34"  y="262" width="26" height="100" rx="3"/>
        <rect class="sky-b" style="animation-delay:.12s" x="64"  y="232" width="20" height="130" rx="3"/>
        <rect class="sky-b" style="animation-delay:.18s" x="88"  y="282" width="34" height="80"  rx="3"/>
        <rect class="sky-b" style="animation-delay:.08s" x="270" y="250" width="24" height="112" rx="3"/>
        <rect class="sky-b" style="animation-delay:.16s" x="298" y="222" width="18" height="140" rx="3"/>
        <rect class="sky-b" style="animation-delay:.22s" x="320" y="272" width="38" height="90"  rx="3"/>
        <rect class="sky-b" style="animation-delay:.28s" x="362" y="292" width="22" height="70"  rx="3"/>
        <rect class="sky-b" style="animation-delay:.25s" x="128" y="300" width="22" height="62"  rx="3"/>
      </g>
      <!-- situ (danau) & riak -->
      <rect x="0" y="360" width="400" height="80" fill="url(#spWater)"/>
      <ellipse class="ripple" cx="200" cy="360" rx="120" ry="14" fill="none" stroke="#9FD9C4" stroke-width="1.5"/>
      <ellipse class="ripple" style="animation-delay:.9s" cx="200" cy="360" rx="120" ry="14" fill="none" stroke="#9FD9C4" stroke-width="1.5"/>
      <ellipse class="ripple" style="animation-delay:1.8s" cx="200" cy="360" rx="120" ry="14" fill="none" stroke="#9FD9C4" stroke-width="1.5"/>
      <circle class="glow" cx="200" cy="170" r="140" fill="url(#spGlow)"/>
      <!-- tangkai + daun -->
      <path class="stem" d="M200 360 C 196 320, 214 280, 204 236 S 200 200, 200 186" fill="none" stroke="#7FC4A6" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(201 330) rotate(-58)"><path class="leafS" style="animation-delay:.8s" d="M0 0 C 14 -10, 18 -44, 0 -62 C -18 -44, -14 -10, 0 0Z" fill="#5DA27E"/></g>
      <g transform="translate(203 305) rotate(54)"><path class="leafS" style="animation-delay:.95s" d="M0 0 C 12 -10, 15 -38, 0 -52 C -15 -38, -12 -10, 0 0Z" fill="#7FC4A6"/></g>
      <!-- anggrek: ikon flora Tangsel -->
      <g transform="translate(200 172)">
        <g class="flower">
          <g transform="rotate(0)"><path class="petalS" style="animation-delay:1.05s" d="M0 0 C 18 -24, 14 -64, 0 -78 C -14 -64, -18 -24, 0 0Z" fill="url(#spSepal)"/></g>
          <g transform="rotate(128)"><path class="petalS" style="animation-delay:1.15s" d="M0 0 C 18 -24, 14 -62, 0 -74 C -14 -62, -18 -24, 0 0Z" fill="url(#spSepal)"/></g>
          <g transform="rotate(-128)"><path class="petalS" style="animation-delay:1.2s" d="M0 0 C 18 -24, 14 -62, 0 -74 C -14 -62, -18 -24, 0 0Z" fill="url(#spSepal)"/></g>
          <g transform="rotate(64)"><path class="petalS" style="animation-delay:1.35s" d="M0 0 C 34 -18, 32 -60, 0 -68 C -32 -60, -34 -18, 0 0Z" fill="url(#spPetal)"/></g>
          <g transform="rotate(-64)"><path class="petalS" style="animation-delay:1.4s" d="M0 0 C 34 -18, 32 -60, 0 -68 C -32 -60, -34 -18, 0 0Z" fill="url(#spPetal)"/></g>
          <g transform="rotate(180)"><path class="petalS" style="animation-delay:1.55s" d="M0 -4 C 26 -8, 30 -40, 0 -50 C -30 -40, -26 -8, 0 -4Z" fill="#8E2F6E"/></g>
          <g transform="rotate(180)"><g class="petalS" style="animation-delay:1.7s"><circle cx="-7" cy="-26" r="2.4" fill="#F7DCEA"/><circle cx="7" cy="-30" r="2" fill="#F7DCEA"/><circle cx="0" cy="-38" r="1.8" fill="#F7DCEA"/></g></g>
          <g><circle class="petalS" style="animation-delay:1.75s" r="8" fill="#FFF1C9"/></g>
        </g>
      </g>
    </svg>
    <div class="wordmark" id="wordmark" aria-hidden="true"></div>
    <p class="tagline">Sudut tersembunyi Tangerang Selatan, satu ketukan dari kamu</p>
  </section>

  <!-- ================= AUTH ================= -->
  <section class="screen hidden" id="auth">
    <div class="auth-hero">
      <div class="art" id="authArt"></div>
      <div class="brand">
        <div class="mark" id="brandMark"></div>
        <div><h1>ExploreTangsel</h1><p>Jelajahi hidden gem di 7 kecamatan</p></div>
      </div>
    </div>
    <div class="auth-sheet" id="authSheet"></div>
  </section>

  <!-- ================= MAIN ================= -->
  <section class="screen hidden" id="main">
    <div class="view" id="v-explore"></div>
    <div class="view" id="v-map"></div>
    <div class="view" id="v-gallery"></div>
    <div class="view" id="v-cctv"></div>
    <div class="view" id="v-profile"></div>

    <nav class="tabbar" role="tablist" aria-label="Navigasi utama" id="tabbar">
      <span class="ind" id="tabInd"></span>
    </nav>

    <article class="sheet" id="detail" aria-hidden="true"></article>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto">
      <div class="lb-top"><span id="lbCap" style="font-weight:700"></span><button class="round" id="lbClose" aria-label="Tutup"></button></div>
      <div class="stagebox" id="lbStage"></div>
      <div class="lb-bot"><button class="round" id="lbPrev" aria-label="Foto sebelumnya"></button><span id="lbCount" style="font-size:13px;opacity:.8"></span><button class="round" id="lbNext" aria-label="Foto berikutnya"></button></div>
    </div>

    <div class="player" id="player" role="dialog" aria-modal="true" aria-label="Kamera CCTV">
      <div class="lb-top" style="padding:calc(16px + env(safe-area-inset-top)) 16px 14px"><span style="font-weight:700">Kamera lalu lintas</span><button class="round" id="plClose" aria-label="Tutup kamera" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:none"></button></div>
      <div class="scrn"><canvas id="plCanvas"></canvas><video id="plVideo" playsinline muted autoplay hidden></video>
        <div class="hud"><div class="tl"><span class="live" id="plBadge"><i></i>Simulasi</span></div><div class="tr" id="plClock"></div><div class="bl" id="plId"></div></div>
      </div>
      <div class="pinfo" id="plInfo"></div>
    </div>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>


<!-- urutan penting: config -> vendor (opsional) -> modul aplikasi -->
<script src="js/config.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/hls/hls.min.js"></script>
<script src="js/native.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/scenes.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
