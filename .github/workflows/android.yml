name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # untuk membuat GitHub Release saat push tag v*

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ET_VERSION_CODE: ${{ github.run_number }}
      ET_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy vendor libraries & set website URL
        run: |
          npm run build
          node scripts/set-site-url.mjs www
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs

      - name: Generate icon & splash
        run: npx capacitor-assets generate --android --iconBackgroundColor "#12443F" --iconBackgroundColorDark "#12443F" --splashBackgroundColor "#12443F" --splashBackgroundColorDark "#0C302C"

      - name: Sync web to native
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExploreTangsel-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ET_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExploreTangsel-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release (tag v* saja)
        if: env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ExploreTangsel-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "ExploreTangsel-${GITHUB_REF_NAME}.apk" --title "ExploreTangsel ${GITHUB_REF_NAME}" --generate-notes || gh release upload "$GITHUB_REF_NAME" "ExploreTangsel-${GITHUB_REF_NAME}.apk" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
